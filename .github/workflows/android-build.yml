name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'APK_DOWNLOAD/**'
      - '.build-outputs/**'
      - 'README.md'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Validate Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify and Locate Generated APK
        id: locate-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK not found in expected output directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Copy and Stage APKs
        run: |
          APK_PATH="${{ steps.locate-apk.outputs.apk_path }}"
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD
          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

      - name: Validate APK Structure and Checksums
        run: |
          echo "=== File Details ==="
          ls -lh .build-outputs/app-debug.apk
          ls -lh APK_DOWNLOAD/app-debug.apk

          echo "=== File Type ==="
          file APK_DOWNLOAD/app-debug.apk

          echo "=== Size Validation ==="
          SIZE=$(stat -c%s APK_DOWNLOAD/app-debug.apk)
          echo "APK Size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK file size too small ($SIZE bytes), possible corrupted build!"
            exit 1
          fi

          echo "=== Unzip Verification ==="
          unzip -t APK_DOWNLOAD/app-debug.apk

          echo "=== SHA-256 Checksum Validation ==="
          HASH1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "SHA256 (.build-outputs): $HASH1"
          echo "SHA256 (APK_DOWNLOAD):  $HASH2"
          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: SHA256 hashes do not match!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 30

      - name: Commit and Push APK to Repository (for GitHub Code Browser downloads)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build-outputs/app-debug.apk
          git add -f APK_DOWNLOAD/app-debug.apk
          git diff --cached --quiet || git commit -m "build: update debug APK [skip ci]"
          git push
